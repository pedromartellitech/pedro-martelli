        const toc =
            document.getElementById("article-toc-links");

        const body =
            document.getElementById("article-body");

        document.documentElement.lang =
            languageNames[lang];

        document.title =
            data.title + " | Pedro Martelli";

        document.getElementById(
            "article-category"
        ).textContent = data.category;

        document.getElementById(
            "article-title"
        ).textContent = data.title;

        document.getElementById(
            "article-date"
        ).textContent = data.date;

        document.getElementById(
            "article-read"
        ).textContent = data.read;

        document.getElementById(
            "article-intro"
        ).textContent = data.intro;

        document.getElementById(
            "toc-title"
        ).textContent = data.toc;

        document.getElementById(
            "back-link"
        ).textContent = "← " + data.back;

        document.getElementById(
            "footer-areas"
        ).textContent = data.footer;

        document.getElementById(
            "footer-copyright"
        ).textContent = data.copyright;

        toc.replaceChildren();
        body.replaceChildren();

        data.sections.forEach(
            function (section, index) {

                const number =
                    String(index + 1).padStart(2, "0");

                const id =
                    "sec-" + (index + 1);

                const tocLink =
                    createElement("a", "", "");

                tocLink.href =
                    "#" + id;

                tocLink.appendChild(
                    createElement(
                        "span",
                        "",
                        number
                    )
                );

                tocLink.appendChild(
                    document.createTextNode(
                        section.title
                    )
                );

                toc.appendChild(
                    tocLink
                );

                const articleSection =
                    createElement(
                        "section",
                        "article-section"
                    );

                articleSection.id =
                    id;

                articleSection.appendChild(
                    createElement(
                        "div",
                        "section-index",
                        number + " / 06"
                    )
                );

                articleSection.appendChild(
                    createElement(
                        "h2",
                        "",
                        section.title
                    )
                );

                section.paragraphs.forEach(
                    function (paragraph) {

                        articleSection.appendChild(
                            createElement(
                                "p",
                                "",
                                paragraph
                            )
                        );

                    }
                );

                body.appendChild(
                    articleSection
                );

            }
        );

        body.appendChild(
            createElement(
                "blockquote",
                "",
                data.quote
            )
        );

        const end =
            createElement(
                "div",
                "article-end"
            );

        const back =
            createElement(
                "a",
                "",
                "← " + data.home
            );

        back.href =
            "../index.html#historias";

        end.appendChild(
            back
        );

        body.appendChild(
            end
        );

        document.getElementById(
            "article-language"
        ).value = lang;

        try {
            localStorage.setItem(
                "portfolio-language",
                lang
            );
        } catch (error) {}

    }

    let initialLanguage =
        "pt";

    try {

        initialLanguage =
            localStorage.getItem(
                "portfolio-language"
            ) || "pt";

    } catch (error) {}

    renderArticle(
        initialLanguage
    );

    document
        .getElementById(
            "article-language"
        )
        .addEventListener(
            "change",
            function () {

                renderArticle(
                    this.value
                );

            }
        );

})();
</script>

</body>
</html>
